<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122521"><title>配对 StopWatch</title><link rel="stylesheet" href="/setup/style.css"></head>
<body><main><h1>配对你的 StopWatch</h1><p>扫码 → 验证挂件 → 直接进入控制台</p>
<p id="message" role="status" aria-live="polite">正在检查这台手机的授权…</p>
<button id="start" disabled>开始配对</button><form id="verify" hidden><label for="code">挂件上刚显示的六位验证码</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button id="submit">验证并进入控制台</button></form>
<p id="device"></p><p class="note">不要求挂件先连 Wi-Fi。手机需能打开本页；配对后挂件未联网会显示「等待联网」，无需重新配对。</p><p class="note">Android 首次可能要求系统蓝牙安全配对，请按提示操作。这里不会再要求另一组控制台登录码。</p>
<p><a href="/setup/">单独设置 Wi-Fi</a> · <a href="/guide/">使用指南</a></p></main><script type="module" src="./app.js"></script></body></html>
