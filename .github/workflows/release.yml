name: Signed stable release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  firmware-release:
    needs: validate
    if: "!github.event.release.prerelease"
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.0.3
    environment: production-signing
    timeout-minutes: 40
    env:
      SW_PRODUCTION: "1"
      SW_SIGNING_KEY_PATH: .secrets/release.pem
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
      - name: Require reviewed production identity
        env:
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
        run: node scripts/provision-release.mjs
      - run: npm ci --no-fund
      - run: node scripts/fetch-upstream.mjs
      - run: node scripts/prepare-firmware.mjs
      - name: Build signed app only
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("release/config.json")).version')
          cd .deps/muse/esp32
          idf.py -B "$GITHUB_WORKSPACE/firmware/build" -DIDF_TARGET=esp32s3 -DPROJECT_VER="$VERSION" -DSW_FACTORY_ASSETS=OFF '-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;devices/sdkconfig.muse;devices/sdkconfig.muse-m5stack-stopwatch;sdkconfig.companion;sdkconfig.release' build
          python -m espsecure verify-signature --version 2 --keyfile "$GITHUB_WORKSPACE/release/trust/stable-public.pem" "$GITHUB_WORKSPACE/firmware/build/muse-gadget.bin"
      - run: node scripts/check-firmware-config.mjs firmware/build
      - name: Package signed manifest
        shell: bash
        run: |
          mkdir -p release-output
          cp firmware/build/muse-gadget.bin release-output/stopwatch-firmware.bin
          node scripts/release-manifest.mjs --kind firmware --binary release-output/stopwatch-firmware.bin --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/stopwatch-firmware.bin" --output release-output/firmware-manifest.json
          node scripts/package-firmware-notices.mjs
          tar -czf release-output/firmware-notices.tar.gz -C release-output firmware-notices
      - name: Publish binary before discovery manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs release-output/firmware-notices.tar.gz release-output/stopwatch-firmware.bin release-output/firmware-manifest.json
      - name: Remove ephemeral private signing key
        if: always()
        run: node -e 'require("fs").rmSync(".secrets",{recursive:true,force:true})'
  windows-release:
    needs: validate
    if: "!github.event.release.prerelease"
    runs-on: windows-latest
    environment: production-signing
    env:
      SW_SIGNING_KEY_PATH: .secrets/release.pem
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
      - run: npm ci --no-fund
      - name: Require production identity
        env:
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
        run: node scripts/provision-release.mjs
      - run: node scripts/package-windows.mjs
      - name: Package first-install archive and signed automatic app update
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-output | Out-Null
          Compress-Archive -Path windows/package/* -DestinationPath release-output/StopWatch-Windows.zip
          Copy-Item windows/package/app/bridge.mjs release-output/stopwatch-bridge.mjs
          node scripts/release-manifest.mjs --kind bridge --binary release-output/stopwatch-bridge.mjs --url "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/stopwatch-bridge.mjs" --output release-output/bridge-manifest.json
      - name: Publish installer and authenticated update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs release-output/StopWatch-Windows.zip release-output/stopwatch-bridge.mjs release-output/bridge-manifest.json
      - name: Clean ephemeral key
        if: always()
        run: node -e 'require("fs").rmSync(".secrets",{recursive:true,force:true})'
  portal-package:
    needs: validate
    if: "!github.event.release.prerelease"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.0"
      - run: npm ci --no-fund
      - run: node scripts/build.mjs --production
      - run: npm prune --omit=dev
      - run: node scripts/package-portal.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-portal-ready-for-approved-deployment
          path: release-output/portal
          retention-days: 14
